
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisdata-ai"
version = "0.1.0"
description = "Autonomous Data Engineering and AI Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "boto3>=1.35",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17",
    "pyspark>=3.5,<4",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.39",
    "plotly>=5.24,<7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.7"
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agents*",
    "api*",
    "data_quality*",
    "ingestion*",
    "ml*",
    "pipelines*",
    "tools*"
]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
