name: AegisData AI - Offline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    name: Python 3.12 - Athena contract and Streamlit offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Validate dashboard Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files = sorted(Path('dashboard').glob('*.py'))
          if not files:
              raise SystemExit('No dashboard Python files found')
          for path in files:
              ast.parse(path.read_text(encoding='utf-8-sig'), filename=str(path))
              print(f'OK: {path}')
          PY

      - name: Run offline Athena contract and Streamlit regression tests
        run: |
          python -m pytest -o addopts='' \
            tests/test_athena_client_contract.py \
            tests/test_dashboard_offline.py \
            -m 'not live' -v -ra \
            --junitxml=offline-test-results.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-pytest-report
          path: offline-test-results.xml
          if-no-files-found: ignore
          retention-days: 14
