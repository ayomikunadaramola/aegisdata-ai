name: Phase 8H - Offline security governance

on:
  push:
    branches: [main]
    paths:
      - 'agents/data_quality/**'
      - 'dashboard/**'
      - 'tests/test_phase8h_security.py'
      - '.gitignore'
      - '.github/workflows/phase8h.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install 'pytest>=8.3,<10'
      - name: Compile security module
        run: python -m py_compile agents/data_quality/phase8h_security.py
      - name: Run Phase 8H security tests
        run: python -m pytest -o addopts='' tests/test_phase8h_security.py -v -ra --junitxml=phase8h-tests.xml
      - name: Audit tracked source and governance configuration
        run: python -m agents.data_quality.phase8h_security
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8h-test-report
          path: phase8h-tests.xml
          if-no-files-found: ignore
          retention-days: 14
