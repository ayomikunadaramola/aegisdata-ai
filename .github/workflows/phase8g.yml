name: Phase 8G - Offline reliability evaluation regression

on:
  push:
    branches: [main]
    paths:
      - 'agents/data_quality/**'
      - 'tests/test_phase8g_evaluation.py'
      - '.github/workflows/phase8g.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Compile evaluation module
        run: python -m py_compile agents/data_quality/phase8g_evaluation.py
      - name: Run offline reliability regression tests
        run: python -m pytest -o addopts='' tests/test_phase8g_evaluation.py -m 'not live' -v -ra --junitxml=phase8g-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8g-test-report
          path: phase8g-results.xml
          if-no-files-found: ignore
          retention-days: 14
