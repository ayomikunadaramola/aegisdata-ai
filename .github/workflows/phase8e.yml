name: Phase 8E - AI Data Quality safety regression

on:
  push:
    branches: [main]
    paths:
      - 'agents/data_quality/**'
      - 'dashboard/**'
      - 'tests/test_phase8e_*.py'
      - '.github/workflows/phase8e.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Compile safety module
        run: python -m py_compile agents/data_quality/phase8e_guard.py
      - name: Run offline safety tests (no AWS inference)
        run: python -m pytest -o addopts='' tests/test_phase8e_guard.py tests/test_phase8e_deterministic.py -m 'not live' -v -ra --junitxml=phase8e-results.xml
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase8e-test-report
          path: phase8e-results.xml
          if-no-files-found: ignore
          retention-days: 14
